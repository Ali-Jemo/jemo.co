<svg width="1024" height="1024" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Metallic Olive-Gold Body Gradient -->
    <linearGradient id="jemo-metallic-body" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#DEEE88" />
      <stop offset="30%" stop-color="#BACB62" />
      <stop offset="70%" stop-color="#8DA03E" />
      <stop offset="100%" stop-color="#5E7026" />
    </linearGradient>

    <!-- Top-Right Chamfer Specular Highlight -->
    <linearGradient id="jemo-chamfer-glint" x1="100%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#EAF6AE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#BACB62" stop-opacity="0.0" />
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <radialGradient id="jemo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BACB62" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#5E7026" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Carved Cutout Inner Shadow -->
    <filter id="carve-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#1A2208" flood-opacity="0.85" />
      <feInnerShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Dark Metallic Canvas Background (Social Media Frame) -->
  <rect width="512" height="512" rx="112" fill="#0A0C07" />

  <!-- Ambient Glow Ring -->
  <circle cx="256" cy="256" r="220" fill="url(#jemo-glow)" />

  <!-- MAIN LOGO EMBLEM GROUP -->
  <g transform="translate(256, 256) scale(0.92) translate(-256, -256)">

    <!-- Outer Shield Body Path with Chamfered Top-Right Corner and Inner Carved 'j' Cutout -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M 170 96
        C 125 96 100 121 100 166
        L 100 300
        C 100 380 156 416 256 416
        C 356 416 412 380 412 300
        L 412 166
        L 342 96
        L 170 96 Z

        M 352 144
        L 352 284
        C 352 334 322 358 256 358
        C 190 358 160 334 160 284
        L 160 262
        C 160 236 178 220 206 220
        L 242 220
        L 242 254
        L 214 254
        C 204 254 198 260 198 270
        L 198 280
        C 198 304 216 320 256 320
        C 296 320 314 304 314 280
        L 314 236
        L 230 188
        L 230 144
        L 352 144 Z

        M 352 188
        L 264 238
        L 314 266
        L 314 188
        L 352 188 Z
      "
      fill="url(#jemo-metallic-body)"
      filter="url(#carve-depth)"
    />

    <!-- Top-Right Chamfer Specular Highlight Overlay -->
    <path
      d="
        M 260 96
        L 342 96
        L 412 166
        L 412 250
        C 412 200 382 170 352 144
        L 260 96 Z
      "
      fill="url(#jemo-chamfer-glint)"
    />

  </g>
</svg>
